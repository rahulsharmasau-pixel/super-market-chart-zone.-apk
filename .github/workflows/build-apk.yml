name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version: $JAVA_VERSION"
          MAJOR_VERSION=$(echo "$JAVA_VERSION" | awk -F. '{print $1}')
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java version 17 or newer is required, but found $JAVA_VERSION"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: debug.keystore could not be created."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            echo "Searching in app/build/outputs/apk:"
            find app/build/outputs/apk -type f
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi
          echo "APK successfully verified at $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUN_DIR=$(mktemp -d)
          ASSET_PATH="$RUN_DIR/app-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi
          echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_SHA="${{ github.sha }}"
          
          NOTES="This is an automatically generated debug APK.
          - Built by GitHub Actions
          - Run Number: ${{ github.run_number }}
          - Run Attempt: ${{ github.run_attempt }}
          - Commit SHA: $TARGET_SHA
          - Intended for testing only (not Play Store production release)
          - Signed with temporary debug keystore."

          gh release create "$TAG_NAME" \
            "${{ steps.prepare_asset.outputs.asset_path }}#app-debug.apk" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$TARGET_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Build & Release Status ==="
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "GitHub Release published successfully."
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$TAG_NAME" || true
            
            DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
            echo "DIRECT APK DOWNLOAD: $DIRECT_URL" >> $GITHUB_STEP_SUMMARY
            echo "DIRECT APK DOWNLOAD: $DIRECT_URL"
            echo "The normal Actions artifact 'app-debug-apk' remains available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "Warning: GitHub Release publishing failed or was skipped."
            echo "However, the debug APK build succeeded and the normal Actions artifact 'app-debug-apk' is available."
          fi
